<script>
(()=>{const canvas=document.getElementById('map'),ctx=canvas.getContext('2d'),wrap=document.getElementById('mapwrap');let W=0,H=0,scale=1,base=1,ox=0,oy=0,drag=null,pointers=new Map(),lastDist=0,moved=false;const WORLD_W=3840,WORLD_H=9788;const TILE=512,LEVELS=[[480,1224],[960,2447],[1920,4894],[3840,9788]];let mapReady=false;const tileCache=new Map();let firstTileShown=false;
// Progressive offline tile renderer: loads only visible 512px WebP tiles at the detail level needed.
function tileUrl(level,tx,ty){return `tiles/z${level}/${tx}_${ty}.webp`}
function requestTile(level,tx,ty){const key=`${level}/${tx}/${ty}`;let item=tileCache.get(key);if(item)return item;const img=new Image();item={img,ready:false,failed:false};tileCache.set(key,item);img.onload=()=>{item.ready=true;if(!firstTileShown){firstTileShown=true;mapReady=true;$('empty').classList.add('hide')}draw()};img.onerror=()=>{item.failed=true};img.src=tileUrl(level,tx,ty);return item}
function drawMapTiles(){const ratio=Math.max(1,scale/base);const level=Math.min(3,Math.max(0,Math.floor(Math.log2(ratio))));const [lw,lh]=LEVELS[level],sx=WORLD_W/lw,sy=WORLD_H/lh;const left=Math.max(0,Math.floor((-ox/scale)/sx/TILE)),top=Math.max(0,Math.floor((-oy/scale)/sy/TILE));const right=Math.min(Math.ceil(lw/TILE)-1,Math.floor(((W-ox)/scale)/sx/TILE)),bottom=Math.min(Math.ceil(lh/TILE)-1,Math.floor(((H-oy)/scale)/sy/TILE));for(let ty=top;ty<=bottom;ty++)for(let tx=left;tx<=right;tx++){const item=requestTile(level,tx,ty);if(item.ready){const px=tx*TILE*sx,py=ty*TILE*sy;ctx.drawImage(item.img,px,py,item.img.width*sx,item.img.height*sy)}}}
// Тайники определены по зелёным круглым значкам на исходной карте. Голубые значки переходов не включены.
let areas=[],stashes=[{id:'stash_green_01',name:'Тайник 01',x:0.192708,y:0.618104},{id:'stash_green_02',name:'Тайник 02',x:0.436458,y:0.591132},{id:'stash_green_03',name:'Тайник 03',x:0.428125,y:0.334083},{id:'stash_green_04',name:'Тайник 04',x:0.277083,y:0.433388},{id:'stash_green_05',name:'Тайник 05',x:0.370312,y:0.313241},{id:'stash_green_06',name:'Тайник 06',x:0.330208,y:0.573968},{id:'stash_green_07',name:'Тайник 07',x:0.076042,y:0.888230},{id:'stash_green_08',name:'Тайник 08',x:0.352344,y:0.306293},{id:'stash_green_09',name:'Тайник 09',x:0.525781,y:0.519207},{id:'stash_green_10',name:'Тайник 10',x:0.417708,y:0.866571},{id:'stash_green_11',name:'Тайник 11',x:0.887760,y:0.634246},{id:'stash_green_12',name:'Тайник 12',x:0.446354,y:0.702697},{id:'stash_green_13',name:'Тайник 13',x:0.325260,y:0.592358},{id:'stash_green_14',name:'Тайник 14',x:0.475260,y:0.480588},{id:'stash_green_15',name:'Тайник 15',x:0.545052,y:0.526563},{id:'stash_green_16',name:'Тайник 16',x:0.448698,y:0.502043},{id:'stash_green_17',name:'Тайник 17',x:0.743750,y:0.726808},{id:'stash_green_18',name:'Тайник 18',x:0.422135,y:0.355129},{id:'stash_green_19',name:'Тайник 19',x:0.336458,y:0.584389},{id:'stash_green_20',name:'Тайник 20',x:0.214323,y:0.877197},{id:'stash_green_21',name:'Тайник 21',x:0.142708,y:0.513077},{id:'stash_green_22',name:'Тайник 22',x:0.273958,y:0.898038},{id:'stash_green_23',name:'Тайник 23',x:0.373438,y:0.576011},{id:'stash_green_24',name:'Тайник 24',x:0.423177,y:0.350633},{id:'stash_green_25',name:'Тайник 25',x:0.387760,y:0.710666},{id:'stash_green_26',name:'Тайник 26',x:0.199740,y:0.748468},{id:'stash_green_27',name:'Тайник 27',x:0.380469,y:0.319166},{id:'stash_green_28',name:'Тайник 28',x:0.377344,y:0.216796},{id:'stash_green_29',name:'Тайник 29',x:0.785938,y:0.684512},{id:'stash_green_30',name:'Тайник 30',x:0.447135,y:0.578055},{id:'stash_green_31',name:'Тайник 31',x:0.298438,y:0.838782},{id:'stash_green_32',name:'Тайник 32',x:0.164062,y:0.869841},{id:'stash_green_33',name: een_66',name:'Тайник 66',x:0.354688,y:0.326318},{id:'stash_green_67',name:'Тайник 67',x:0.209896,y:0.633429},{id:'stash_green_68',name:'Тайник 68',x:0.533594,y:0.494687}],anomalies=[];let selected=null;let seen=JSON.parse(localStorage.getItem('expedition_seen_v3')||'{}'),notes=JSON.parse(localStorage.getItem('expedition_notes_v3')||'{}');const $=id=>document.getElementById(id);
function clampView(){const mw=WORLD_W*scale,mh=WORLD_H*scale;if(mw<=W)ox=(W-mw)/2;else ox=Math.min(0,Math.max(W-mw,ox));if(mh<=H)oy=(H-mh)/2;else oy=Math.min(0,Math.max(H-mh,oy));}
function resize(){const r=wrap.getBoundingClientRect(),d=window.devicePixelRatio||1;W=r.width;H=r.height;canvas.width=Math.round(W*d);canvas.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);fit();}
window.addEventListener('resize',resize);
function fit(){base=Math.min(W/WORLD_W,H/WORLD_H);scale=base;ox=(W-WORLD_W*scale)/2;oy=(H-WORLD_H*scale)/2;clampView();draw()}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#1b2522';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);drawMapTiles();ctx.restore();renderMarkers();renderLabels();updateEmpty();}
function toScreen(x,y){return{x:ox+x*scale,y:oy+y*scale}}
function addMarker(m,type){let el=document.createElement('button');el.className='marker '+(type==='anomaly'?'anomaly ':'')+(type==='stash'?'stash ':'')+(seen[m.id]?'seen':'');el.dataset.id=m.id;el.title=m.name||'';el.setAttribute('aria-label',m.name||'Метка');el.style.setProperty('--ms',Math.max(10,22/Math.max(1,scale/base))+'px');el.innerHTML=type==='anomaly'?'<span>✦</span>':(type==='stash'?'<svg viewBox="0 0 32 32" aria-hidden="true" fill="none"><path d="M6 11.5 16 6l10 5.5v13H6z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M6.5 12h19M12 6.9v4.8m8-4.8v4.8M11 16h10v8H11z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14.2 19.8h3.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>':'');let pt=toScreen(m.x*WORLD_W,m.y*WORLD_H);el.style.left=pt.x+'px';el.style.top=pt.y+'px';el.addEventListener('click',e=>{e.stopPropagation();selectMarker(m,type,el)});wrap.appendChild(el)}
function clearRendered(){wrap.querySelectorAll('.marker,.loclabel').forEach(e=>e.remove())}
function renderMarkers(){clearRendered();stashes.forEach(m=>addMarker(m,'stash'));}
function renderLabels(){wrap.querySelectorAll('.loclabel').forEach(e=>e.remove());const fade=Math.max(0,Math.min(1,(scale/base-1.0)/1.1));areas.forEach(a=>{let pt=toScreen(a.x*WORLD_W,a.y*WORLD_H),el=document.createElement('div');el.className='loclabel';el.textContent=a.name;el.style.cssText=`position:absolute;z-index:3;left:${pt.x}px;top:${pt.y}px;transform:translate(-50%,-50%);font:bold 11px Arial;letter-spacing:1px;color:#d1d8c8;text-shadow:0 1px 4px #000,0 0 5px #000;opacity:${1-fade};pointer-events:none;white-space:nowrap`;wrap.appendChild(el)})}
function updateEmpty(){$('empty').classList.toggle('hide',mapReady)}
function selectMarker(m,type,el){selected={m,type};wrap.querySelectorAll('.marker').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');$('floatmenu').style.display=type==='stash'?'flex':'none';$('noteview').style.display='none';$('editor').style.display='none';const pt=toScreen(m.x*WORLD_W,m.y*WORLD_H);$('floatmenu').style.left=pt.x+'px';$('floatmenu').style.top=pt.y+'px';if(type==='anomaly'){showNoteBox(pt,m.name||'АНОМАЛИЯ',m.description||'Информация об этой аномалии будет добавлена из проверенного справочника.');}}
function showNoteBox(pt,title,body){let n=$('noteview');n.innerHTML='';let h=document.createElement('b');h.textContent=title;let p=document.createElement('div');p.textContent=body;n.append(h,p);let b=document.createElement('button');b.textContent='ЗАКРЫТЬ';b.onclick=()=>n.style.display='none';n.append(b);n.style.left=Math.min(W-200,Math.max(8,pt.x+15))+'px';n.style.top=Math.min(H-120,Math.max(8,pt.y+15))+'px';n.style.display='block'}
$('viewed').onclick=()=>{if(!selected)return;seen[selected.m.id]=true;localStorage.setItem('expedition_seen_v3',JSON.stringify(seen));$('floatmenu').style.display='none';draw();$('counter').textContent=`ТАЙНИКИ: ${stashes.length} · ПРОСМОТРЕНО: ${Object.keys(seen).filter(k=>seen[k]).length}`};
$('notesBtn').onclick=()=>{if(!selected)return;$('floatmenu').style.display='none';$('noteText').value=notes[selected.m.id]||'';let pt=toScreen(selected.m.x*WORLD_W,selected.m.y*WORLD_H);$('editor').style.left=Math.min(W-340,Math.max(8,pt.x+18))+'px';$('editor').style.top=Math.min(H-160,Math.max(8,pt.y+18))+'px';$('editor').style.display='block';$('noteText').focus()};
$('saveNote').onclick=()=>{if(!selected)return;let v=$('noteText').value.trim();if(v)notes[selected.m.id]=v;else delete notes[selected.m.id];localStorage.setItem('expedition_notes_v3',JSON.stringify(notes));$('editor').style.display='none';let pt=toScreen(selected.m.x*WORLD_W,selected.m.y*WORLD_H);if(v)showNoteBox(pt,'МОЯ ЗАМЕТКА',v)};$('cancelNote').onclick=()=>$('editor').style.display='none';
function world(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left-ox)/scale,y:(e.clientY-r.top-oy)/scale}}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function zoomAt(f,x=W/2,y=H/2){const ns=Math.max(base,Math.min(base*64,scale*f));const k=ns/scale;ox=x-(x-ox)*k;oy=y-(y-oy)*k;scale=ns;clampView();draw()}
function localPointer(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;if(pointers.size===1)drag={x:e.clientX,y:e.clientY,ox,oy};if(pointers.size===2){drag=null;let a=[...pointers.values()];lastDist=dist(a[0],a[1])}});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1&&drag){let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;ox=drag.ox+dx;oy=drag.oy+dy;clampView();draw()}else if(pointers.size===2){let a=[...pointers.values()],d=dist(a[0],a[1]);if(lastDist){let mid=localPointer({clientX:(a[0].x+a[1].x)/2,clientY:(a[0].y+a[1].y)/2});zoomAt(d/lastDist,mid.x,mid.y)}lastDist=d}});
function end(e){pointers.delete(e.pointerId);if(!pointers.size)drag=null;if(pointers.size<2)lastDist=0}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
$('plus').onclick=()=>zoomAt(1.5);$('minus').onclick=()=>zoomAt(1/1.5);$('reset').onclick=fit;
$('counter').textContent=`ТАЙНИКИ: ${stashes.length} · ПРОСМОТРЕНО: ${Object.keys(seen).filter(k=>seen[k]).length}`;resize();
})();
